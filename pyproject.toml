[project]
name = "next-sequence"
version = "0.1.0"
description = "Multi-task next-event prediction for sequences, with a transformer encoder on PyTorch"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "doublebank" }]
keywords = ["sequence", "next-item", "transformer", "multi-task", "pytorch", "recommendation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Keep this generic: the end user's environment decides CPU vs CUDA vs MPS build.
    # 2.2 is the oldest torch with Python 3.12 wheels; the test suite passes on it.
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/datanooblol/next-sequence"
Repository = "https://github.com/datanooblol/next-sequence"
Issues = "https://github.com/datanooblol/next-sequence/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
    "pytest>=8",
]
# Dev-only selectors for which torch build uv installs (not published).
# `gpu` is on by default (see default-groups); use `--no-group gpu --group cpu` for CPU.
cpu = ["torch>=2.2"]
gpu = ["torch>=2.2"]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# uv-only settings below. They are NOT included in the published wheel metadata;
# they only control how torch is resolved when developing this repo with uv.
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev", "gpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu132", group = "gpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
